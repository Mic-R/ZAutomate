name: C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install cmake ninja curl

      - name: Setup MSYS2 and install MinGW packages (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-ninja

      - name: Configure (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cmake --build cpp/build

      - name: Run tests (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Configure (Windows - MSYS2 MinGW)
        if: runner.os == 'Windows'
        run: msys2_shell.cmd -mingw64 -c "cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release"

      - name: Build (Windows - MSYS2 MinGW)
        if: runner.os == 'Windows'
        run: msys2_shell.cmd -mingw64 -c "cmake --build cpp/build -- -j"

      - name: Run tests (Windows - MSYS2 MinGW)
        if: runner.os == 'Windows'
        run: msys2_shell.cmd -mingw64 -c "ctest --test-dir cpp/build --output-on-failure"
