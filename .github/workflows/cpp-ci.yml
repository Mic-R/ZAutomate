name: C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install cmake ninja curl

      - name: Install Qt 6 (Windows, MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: 'true'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          & $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat
          cd cpp
          & $env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe install --triplet x64-windows

      - name: Configure (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cmake --build cpp/build

      - name: Run tests (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Configure (Windows - MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Windows - MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build cpp/build --config Release --parallel

      - name: Run tests (Windows - MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir cpp/build --output-on-failure -C Release
