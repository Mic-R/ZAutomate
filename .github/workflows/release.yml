name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ENABLE_NSIS: 'ON'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev dpkg-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja curl qt

      - name: Install Qt 6 (Windows, MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: 'true'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          & $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat
          cd cpp
          & $env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe install --triplet x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)/lib/cmake"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build cpp/build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build cpp/build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build cpp/build --config Release --parallel

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir cpp/build --output-on-failure -C Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cpack --config cpp/build/CPackConfig.cmake -B cpp/build/packages

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cpack --config cpp/build/CPackConfig.cmake -B cpp/build/packages

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'cpp\build\packages' | Out-Null
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'dist\zautomate-windows'
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item 'cpp\build\Release\zautomate.exe' $bundleDir

          # Ensure libcurl.dll is present in the bundle root.
          $curlCandidates = @(
            (Join-Path $env:GITHUB_WORKSPACE 'libcurl.dll'),
            (Join-Path $env:GITHUB_WORKSPACE 'cpp\build\Release\libcurl.dll'),
            (Join-Path $env:GITHUB_WORKSPACE 'vcpkg\installed\x64-windows\bin\libcurl.dll')
          )
          $curlDll = $null
          foreach ($candidate in $curlCandidates) {
            if (Test-Path $candidate) {
              $curlDll = $candidate
              break
            }
          }
          if (-not $curlDll) {
            throw 'libcurl.dll not found in expected locations; cannot create runnable Windows bundle.'
          }
          Copy-Item $curlDll $bundleDir -Force

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime $bundleDir\zautomate.exe
          Compress-Archive -Path "$bundleDir\*" -DestinationPath 'cpp\build\packages\zautomate-windows-bundle.zip' -Force

      - name: Install NSIS (Windows, optional)
        if: runner.os == 'Windows' && env.ENABLE_NSIS == 'ON'
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Package NSIS installer (Windows, optional)
        if: runner.os == 'Windows' && env.ENABLE_NSIS == 'ON'
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_BUILD_TYPE=Release
          cpack --config cpp/build/CPackConfig.cmake -G NSIS -B cpp/build/packages

      - name: Dump NSIS logs (on failure)
        if: runner.os == 'Windows' && env.ENABLE_NSIS == 'ON' && failure()
        shell: pwsh
        run: |
          $nsisDir = Join-Path 'cpp\build\packages' '_CPack_Packages\win64\NSIS'
          if (Test-Path $nsisDir) {
            Write-Host "Listing $nsisDir"
            Get-ChildItem $nsisDir | ForEach-Object { Write-Host $_.FullName }
            $outLog = Join-Path $nsisDir 'NSISOutput.log'
            $nsiFile = Join-Path $nsisDir 'project.nsi'
            if (Test-Path $outLog) {
              Write-Host '==== NSISOutput.log ===='
              Get-Content $outLog -ErrorAction SilentlyContinue | Select-Object -First 400 | ForEach-Object { Write-Host $_ }
              Write-Host '==== end NSISOutput.log ===='
            } else {
              Write-Host 'No NSISOutput.log found'
            }
            if (Test-Path $nsiFile) {
              Write-Host '==== project.nsi ===='
              Get-Content $nsiFile -ErrorAction SilentlyContinue | Select-Object -First 400 | ForEach-Object { Write-Host $_ }
              Write-Host '==== end project.nsi ===='
            } else {
              Write-Host 'No project.nsi found'
            }
          } else {
            Write-Host "$nsisDir does not exist"
          }

      - name: Upload NSIS debug artifact (on failure)
        if: runner.os == 'Windows' && env.ENABLE_NSIS == 'ON' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: nsis-debug-${{ github.run_id }}
          path: cpp/build/packages/_CPack_Packages/win64/NSIS

      - name: Collect ZIP package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'cpp\build\*.zip') {
            Copy-Item 'cpp\build\*.zip' 'cpp\build\packages\' -Force
          }

      - name: Collect Linux/macOS packages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p cpp/build/packages
          cp -f cpp/build/*.deb cpp/build/packages/ 2>/dev/null || true
          cp -f cpp/build/*.tgz cpp/build/packages/ 2>/dev/null || true
          cp -f cpp/build/*.tar.gz cpp/build/packages/ 2>/dev/null || true
          cp -f cpp/build/*.dmg cpp/build/packages/ 2>/dev/null || true

      - name: Prepare upload artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p cpp/build/artifacts
          find cpp/build/packages -maxdepth 1 -type f \( -name '*.deb' -o -name '*.tgz' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp -f {} cpp/build/artifacts/ \;

      - name: Prepare upload artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'cpp\build\artifacts' | Out-Null
          Get-ChildItem 'cpp\build\packages' -File | ForEach-Object {
            Copy-Item $_.FullName 'cpp\build\artifacts\' -Force
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: cpp/build/artifacts/*
          if-no-files-found: error
          compression-level: 0

  create-release:
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.tgz
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.dmg
          generate_release_notes: true

  ftp-upload:
    runs-on: ubuntu-latest
    needs: [build-packages, create-release]
    if: success()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload release files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/${{ github.ref_name }}/
          dangerous-clean-slate: false
