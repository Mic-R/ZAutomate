name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev dpkg-dev

      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build --config Release

      - name: Run tests
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Package
        run: cpack --config cpp/build/CPackConfig.cmake

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            cpp/build/*.deb
            cpp/build/*.tgz
            cpp/build/*.zip

  create-release:
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.tgz
            dist/**/*.zip
          generate_release_notes: true
