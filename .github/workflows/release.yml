name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev dpkg-dev qt6-base-dev qt6-wayland

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja curl qt

      - name: Install Qt 6 (Windows, MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: 'true'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          & $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat
          cd cpp
          & $env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe install --triplet x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)/lib/cmake"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build cpp/build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build cpp/build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build cpp/build --config Release --parallel

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir cpp/build --output-on-failure -C Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cpack --config cpp/build/CPackConfig.cmake -B cpp/build/packages

      - name: Smoke test Linux tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(find cpp/build/packages -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.tar.gz' \) -print -quit)
          if [ -z "$TARBALL" ]; then
            echo "No Linux tarball found under cpp/build/packages" >&2
            exit 1
          fi

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT
          tar -xf "$TARBALL" -C "$WORK_DIR"

          APP_BIN=$(find "$WORK_DIR" -path '*/bin/zautomate' -type f -perm -111 -print -quit)
          if [ -z "$APP_BIN" ]; then
            echo "No executable bin/zautomate found inside $TARBALL" >&2
            find "$WORK_DIR" -maxdepth 3 -type f | sort >&2
            exit 1
          fi

          echo "Smoke testing $APP_BIN"
          rc=0
          timeout 15s env QT_QPA_PLATFORM=offscreen "$APP_BIN" >/tmp/zautomate-smoke.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/zautomate-smoke.log >&2
            exit "$rc"
          fi

      - name: Bundle Qt libs (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find cpp/build -maxdepth 3 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under cpp/build; ensure the project is built as a macOS bundle." && exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"
          if [ ! -x "$MACDEPLOYQT" ]; then
            echo "macdeployqt not found at $MACDEPLOYQT; ensure Qt is installed via brew." && exit 1
          fi
          "$MACDEPLOYQT" "$APP_PATH"

      - name: Bundle non-Qt dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find cpp/build -maxdepth 3 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under cpp/build; cannot bundle non-Qt dylibs." && exit 1
          fi
          APP_BIN=$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 -print -quit)
          if [ -z "$APP_BIN" ]; then
            echo "No executable found in $APP_PATH/Contents/MacOS" && exit 1
          fi
          echo "App: $APP_PATH  Bin: $APP_BIN"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          # Find absolute, non-system dylib deps (homebrew / local) used by the app
          DEPS=$(otool -L "$APP_BIN" | awk '{print $1}' | grep -E '^/opt/homebrew|^/usr/local' | grep -E 'libcurl|libssl|libcrypto|nghttp2' | sort -u || true)
          if [ -z "$DEPS" ]; then
            echo "No non-system dylib deps found to bundle." && exit 0
          fi
          echo "Bundling deps: $DEPS"

          for dep in $DEPS; do
            cp -f "$dep" "$FRAMEWORKS/"
            BASENAME=$(basename "$dep")
            # Set the id of the copied dylib to be relative to the bundle
            install_name_tool -id "@rpath/$BASENAME" "$FRAMEWORKS/$BASENAME" || true
            # Change app binary reference to point into Frameworks
            install_name_tool -change "$dep" "@executable_path/../Frameworks/$BASENAME" "$APP_BIN" || true
            # Ensure app will search Frameworks at runtime
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_BIN" || true
          done

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cpack --config cpp/build/CPackConfig.cmake -B cpp/build/packages

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'cpp\build\packages' | Out-Null
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'dist\zautomate-windows'
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item 'cpp\build\Release\zautomate.exe' $bundleDir
          Copy-Item 'cpp\install.bat' $bundleDir
          Copy-Item 'LICENSE' $bundleDir

          # Ensure libcurl.dll is present in the bundle root.
          $curlCandidates = @(
            (Join-Path $env:GITHUB_WORKSPACE 'libcurl.dll'),
            (Join-Path $env:GITHUB_WORKSPACE 'cpp\build\Release\libcurl.dll'),
            (Join-Path $env:GITHUB_WORKSPACE 'vcpkg\installed\x64-windows\bin\libcurl.dll')
          )
          $curlDll = $null
          foreach ($candidate in $curlCandidates) {
            if (Test-Path $candidate) {
              $curlDll = $candidate
              break
            }
          }
          if (-not $curlDll) {
            throw 'libcurl.dll not found in expected locations; cannot create runnable Windows bundle.'
          }
          Copy-Item $curlDll $bundleDir -Force

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime $bundleDir\zautomate.exe
          Compress-Archive -Path "$bundleDir\*" -DestinationPath 'cpp\build\packages\zautomate-windows-bundle.zip' -Force

      - name: Collect ZIP package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'cpp\build\*.zip') {
            Copy-Item 'cpp\build\*.zip' 'cpp\build\packages\' -Force
          }

      - name: Collect Linux/macOS packages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p cpp/build/packages
          cp -f cpp/build/*.deb cpp/build/packages/ 2>/dev/null || true
          cp -f cpp/build/*.tgz cpp/build/packages/ 2>/dev/null || true
          cp -f cpp/build/*.tar.gz cpp/build/packages/ 2>/dev/null || true
          cp -f cpp/build/*.dmg cpp/build/packages/ 2>/dev/null || true

      - name: Prepare upload artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p cpp/build/artifacts
          find cpp/build/packages -maxdepth 1 -type f \( -name '*.deb' -o -name '*.tgz' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp -f {} cpp/build/artifacts/ \;

      - name: Prepare upload artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'cpp\build\artifacts' | Out-Null
          Get-ChildItem 'cpp\build\packages' -File | ForEach-Object {
            Copy-Item $_.FullName 'cpp\build\artifacts\' -Force
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: cpp/build/artifacts/*
          if-no-files-found: error
          compression-level: 0

  create-release:
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.tgz
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.dmg
          generate_release_notes: true

  ftp-upload:
    runs-on: ubuntu-latest
    needs: [build-packages, create-release]
    if: success()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload release files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/${{ github.ref_name }}/
          dangerous-clean-slate: false
