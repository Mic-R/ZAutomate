name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ENABLE_NSIS: ${{ vars.ENABLE_NSIS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev dpkg-dev

      - name: Install Qt 6 (Windows, MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: 'true'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          & $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat
          cd cpp
          & $env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe install --triplet x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build cpp/build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build cpp/build --config Release --parallel

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir cpp/build --output-on-failure -C Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cpack --config cpp/build/CPackConfig.cmake

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'dist\zautomate-windows'
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item 'cpp\build\Release\zautomate.exe' $bundleDir
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime $bundleDir\zautomate.exe
          Compress-Archive -Path "$bundleDir\*" -DestinationPath 'cpp\build\zautomate-windows-bundle.zip' -Force

      - name: Install NSIS (Windows, optional)
        if: runner.os == 'Windows' && env.ENABLE_NSIS == 'ON'
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Package NSIS installer (Windows, optional)
        if: runner.os == 'Windows' && env.ENABLE_NSIS == 'ON'
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake" `
            -DCMAKE_BUILD_TYPE=Release
          cpack --config cpp/build/CPackConfig.cmake -G NSIS

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            cpp/build/*.deb
            cpp/build/*.tgz
            cpp/build/*.zip
            cpp/build/*.exe
            cpp/build/zautomate-windows-bundle.zip

  create-release:
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.tgz
            dist/**/*.zip
            dist/**/*.exe
          generate_release_notes: true
